<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <title>PALZ</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <script>
      // Override alert() before any scripts load so Unity's framework.js
      // cannot show blocking dialogs — errors are logged to console instead.
      window.alert = function(msg) { console.error('[Unity]', msg); };
    </script>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }

      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
      }

      #unity-container {
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      #unity-canvas {
        height: 100vh;
        width: auto;
        aspect-ratio: 1080 / 1920;
        display: block;
      }

      #unity-loading-bar {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
      }
      #unity-progress-bar-empty {
        width: 200px;
        height: 8px;
        background: #333;
        border-radius: 4px;
        margin-top: 10px;
      }
      #unity-progress-bar-full {
        width: 0%;
        height: 100%;
        background: #fff;
        border-radius: 4px;
        transition: width 0.2s;
      }

    </style>
  </head>
  <body>

    <script src="Build/09c76aaf3ec144a38a474ddb3e24213d.loader.js"></script>
    <div id="unity-container">
      <canvas id="unity-canvas" width=1080 height=1920></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
    </div>
    <script>
      var canvas          = document.querySelector("#unity-canvas");
      var loadingBar      = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");

      function unityShowBanner(msg, type) {
        if (type === 'error') console.error('[Unity] ' + msg);
        else console.warn('[Unity] ' + msg);
      }

      var buildUrl  = "Build";
      var loaderUrl = buildUrl + "/09c76aaf3ec144a38a474ddb3e24213d.loader.js";
      var config = {
        dataUrl:            "Build/2ff82bb7272bd3ad64a173a33ab54d21.data.br",
        frameworkUrl:       "Build/6a25ddd826c6ce4c45d70b17b0bcf758.framework.js.br",
        codeUrl:            "Build/df24ffd50da985eaa1ba5e34f8a1b22a.wasm.br",
        streamingAssetsUrl: "StreamingAssets",
        companyName:        "ElevateCore",
        productName:        "PALZ",
        productVersion:     "1.0",
        showBanner:         unityShowBanner,
      };

      loadingBar.style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onerror = function() {
        console.error('[Unity] Failed to load Unity loader: ' + loaderUrl);
      };
      script.onload = function() {
        createUnityInstance(canvas, config, function(progress) {
          progressBarFull.style.width = (100 * progress) + "%";
        }).then(function(unityInstance) {
          window.unityInstance = unityInstance;
          loadingBar.style.display = "none";
        }).catch(function(message) {
          console.error('[Unity] createUnityInstance failed: ' + message);
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
